<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retraite Sereine</title>

    <link rel="stylesheet" href="src/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header-navigation">
      <a href="#" class="logo-container">
        <svg viewBox="0 0 100 100" width="40" height="40">
          <path d="M42,28 Q35,15 22,25 Q32,38 42,28 Z" fill="#c4975b" />
          <path d="M46,24 Q42,8 28,12 Q34,28 46,24 Z" fill="#d9ad6b" />
          <path d="M54,26 Q55,10 43,8 Q44,25 54,26 Z" fill="#b3864b" />
          <path
            d="M35,52 L55,34 L75,52 L75,80 L35,80 Z"
            fill="none"
            stroke="#c4975b"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <rect
            x="50"
            y="55"
            width="12"
            height="12"
            fill="none"
            stroke="#c4975b"
            stroke-width="3"
          />
        </svg>
        <strong class="logo-text">Retraite Sereine</strong>
      </a>
    </header>

    <main>
      <h1>Trouvez l'EHPAD idéal pour vos proches</h1>
      <p>
        Le répertoire complet des résidences médicalisées à Paris et ses
        alentours
      </p>
    </main>
    <section class="search">
      <input type="search" placeholder="Nom de l'établissement" />
      <input type="search" placeholder="Code postal / Arrondissements" />
      <button>Rechercher</button>
    </section>

    <section id="parent" class="parent">
    </section>
  
    <section class="voirPlus">
    <button class="btn-plus">Voir plus de résidence</button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
